<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Petite page web</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #005f73;
            color: white;
            padding: 1em;
            text-align: center;
            border-radius: 5px;
        }
        main {
            margin-top: 1.5em;
        }
        footer {
            margin-top: 2em;
            font-size: 0.9em;
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>
    <header>
        <h1>Bienvenue sur ma page web</h1>
    </header>
    <main>
        <p>Ceci est une petite page web simplement réalisée en HTML.</p>
        <p>Tu peux y ajouter du texte, des images, des liens, selon tes besoins.</p>
    </main>
    <footer>
        &copy; 2025 - Exemple rapide HTML
    </footer>
</body>
</html>
